<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>e-zone</title>
<meta name="theme-color" content="#0A0D16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="e-zone">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="page">

  <!-- 1 · header -->
  <header class="hdr">
    <div class="brand"><span class="dot" id="statusDot"></span><span class="wordmark">e-zone</span></div>
    <div class="hdr-right">
      <span id="badges"></span>
      <span class="chip-sm" id="outdoorChip" hidden></span>
      <button class="theme-btn" id="actBtn" aria-label="Activity log">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="8.5"/><path d="M12 8v4l2.6 2.6"/>
        </svg>
      </button>
      <button class="theme-btn" id="themeBtn" aria-label="Toggle theme">&#9681;</button>
    </div>
  </header>

  <!-- 2 · hero -->
  <section class="hero">
    <div class="dial-wrap" id="dial" aria-label="Set temperature dial">
      <svg viewBox="0 0 260 260" aria-hidden="true">
        <defs>
          <linearGradient id="heatGrad" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#C2451A"/>
            <stop offset="1" stop-color="#FF7A45"/>
          </linearGradient>
        </defs>
        <path id="dialTrack" fill="none" stroke-width="16" stroke-linecap="round"></path>
        <path id="dialArc" fill="none" stroke-width="16" stroke-linecap="round"></path>
        <circle id="roomDot" r="3.5" visibility="hidden"></circle>
        <circle id="handleO" r="12"></circle>
        <circle id="handleI" r="4"></circle>
      </svg>
      <span class="dial-lab min">16&deg;</span>
      <span class="dial-lab max">32&deg;</span>
      <button class="dial-lock" id="dialLock" aria-label="Unlock temperature dial" aria-pressed="true">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="11" width="14" height="9" rx="2"/>
          <path id="shackle" d="M8 11V8a4 4 0 0 1 8 0v3"/>
        </svg>
      </button>
      <div class="dial-center">
        <span class="lbl">Set to</span>
        <div class="setpoint"><span id="setTemp">--</span>&deg;</div>
        <span class="delta-chip" id="deltaChip">system off</span>
        <div class="room-line" id="roomLine">&nbsp;</div>
      </div>
    </div>

    <div class="stepper-row">
      <button class="step-btn" id="tempDown" aria-label="Lower temperature">&#8722;</button>
      <button class="pwr-btn" id="powerBtn" aria-label="Power">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M12 3v9"/><path d="M17.7 6.6a8 8 0 1 1-11.4 0"/>
        </svg>
      </button>
      <button class="auto-pill" id="autoBtn" aria-pressed="false">auto</button>
      <button class="step-btn" id="tempUp" aria-label="Raise temperature">+</button>
    </div>

    <div class="mode-grid" id="modeGrid"></div>
  </section>

  <!-- 3 · fan / timer -->
  <section class="card rows-card">
    <div class="ft-row">
      <span class="row-lbl">Fan</span>
      <div class="chips" id="fanChips"></div>
    </div>
    <div class="divider"></div>
    <div class="ft-row">
      <span class="row-lbl">Timer</span>
      <div class="chips" id="timerChips"></div>
    </div>
  </section>

  <!-- 4 · today -->
  <section class="card today-card" id="todayCard" hidden>
    <div>
      <div class="lbl" id="todayTitle">Runtime today</div>
      <div class="today-big" id="todayRuntime">0m</div>
      <div class="lbl" id="todaySub"></div>
      <button class="lbl filter-btn" id="filterBtn" hidden></button>
    </div>
    <svg id="spark" width="118" height="38" viewBox="0 0 118 38" aria-label="Hours the system ran today"></svg>
  </section>

  <!-- 4b · temperature history -->
  <section class="card temps-card" id="tempsCard" hidden>
    <div class="lbl">Temperature &middot; last 24h</div>
    <svg id="tempChart" height="120" aria-label="Zone temperature over the last 24 hours"></svg>
    <div class="temps-legend" id="tempsLegend"></div>
  </section>

  <!-- 5 · zones -->
  <div class="sec-lbl">Zones</div>
  <div id="zoneList"></div>

  <!-- 6 · schedules -->
  <div class="sec-lbl">Schedules <span class="sec-note">read-only &middot; edit on wall panel</span></div>
  <div class="sched-group" id="schedList"></div>

  <!-- 7 · footer -->
  <footer class="foot" id="footInfo"></footer>

</div>

<!-- activity sheet: the flight recorder -->
<div class="sheet" id="actSheet" aria-hidden="true" role="dialog" aria-label="Activity log">
  <div class="sheet-inner">
    <header class="sheet-hdr">
      <div>
        <div class="sheet-title">Activity</div>
        <div class="sheet-sub">everything that moved, and who moved it</div>
      </div>
      <button class="theme-btn sheet-close" id="actClose" aria-label="Close activity">&#10005;</button>
    </header>
    <div class="act-filters" id="actFilters">
      <button class="chip-btn active" data-src="">all</button>
      <button class="chip-btn" data-src="you">you</button>
      <button class="chip-btn" data-src="auto">auto</button>
      <button class="chip-btn" data-src="wall,system">wall &amp; system</button>
    </div>
    <div class="act-scroll" id="actScroll">
      <button class="act-new" id="actNew" hidden>&#8593; new activity</button>
      <div id="actList"></div>
      <div class="act-more" id="actMore" hidden>&#8230;</div>
      <div class="act-empty" id="actEmpty" hidden>
        <div class="act-empty-glyph">&#9678;</div>
        Nothing recorded yet.<br>The flight recorder starts with the next change.
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="app.js"></script>
</body>
</html>

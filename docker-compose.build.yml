# Local-build variant: docker compose -f docker-compose.build.yml up -d --build
services:
  ezone:
    build: .
    container_name: ezone
    restart: unless-stopped
    ports:
      - "8321:8000"
    environment:
      EZONE_HOST: 10.160.1.180
      EZONE_PORT: "2025"
      POLL_SECONDS: "30"
    volumes:
      - ezone-data:/data

volumes:
  ezone-data:
